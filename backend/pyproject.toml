[project]
name = "rsa-teaching-backend"
version = "0.1.0"
description = "Backend for the RSA / Shor teaching game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "numpy>=1.26.0",
  "qiskit>=2.4.1",
  "qiskit-aer>=0.17.2",
  "qiskit-ibm-runtime>=0.47.0",
  # Shor lives in qward.algorithms.shor, published from 0.28.1 onward.
  "qiskit-qward>=0.28.1",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

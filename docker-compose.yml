services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ../qiskit-qward:/qward
    environment:
      - PYTHONPATH=/app
      - QWARD_EDITABLE=/qward
    command: >
      sh -c "pip install -e /qward -q &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./game:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

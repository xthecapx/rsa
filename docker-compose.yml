services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    environment:
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 7001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7013:7013"
    environment:
      - BACKEND_URL=http://backend:7001
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
    ports:
      - "7019:7019"
    environment:
      - BACKEND_URL=http://backend:7001
      - WATCHPACK_POLLING=true
    volumes:
      - ./game:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
